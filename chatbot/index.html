<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Uma interface simples e minimalista para conversar com a IA."
    />
    <title>Conversa — Assistente</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="chat" aria-label="Chat com o assistente">
      <header class="chat__header">
        <div class="chat__identity">
          <div class="chat__avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path
                d="M12 3.5 13.9 10l6.6 2-6.6 2-1.9 6.5L10.1 14l-6.6-2 6.6-2L12 3.5Z"
                stroke="currentColor"
                stroke-linejoin="round"
                stroke-width="1.6"
              />
            </svg>
          </div>
          <div>
            <h1 class="chat__title">Assistente</h1>
            <p class="chat__status">
              <span class="chat__status-dot" aria-hidden="true"></span>
              Disponível para conversar
            </p>
          </div>
        </div>
        <button
          class="button button--secondary chat__clear"
          id="clear-chat"
          type="button"
          aria-label="Limpar histórico da conversa"
          title="Limpar conversa"
        >
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path
              d="M3.75 5.5h12.5m-10.75 0 .65 10.15c.04.65.58 1.15 1.23 1.15h4.24c.65 0 1.19-.5 1.23-1.15L13.5 5.5m-6.25 0V3.75c0-.41.34-.75.75-.75h4c.41 0 .75.34.75.75V5.5m-4.5 3v5m3-5v5"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.4"
            />
          </svg>
          <span>Limpar</span>
        </button>
      </header>

      <section
        class="chat__messages"
        id="messages"
        aria-label="Mensagens da conversa"
        aria-live="polite"
        aria-relevant="additions text"
      >
        <div class="chat__empty" id="empty-state">
          <span class="chat__empty-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path
                d="M12 3.5 13.9 10l6.6 2-6.6 2-1.9 6.5L10.1 14l-6.6-2 6.6-2L12 3.5Z"
                stroke="currentColor"
                stroke-linejoin="round"
                stroke-width="1.4"
              />
            </svg>
          </span>
          <h2>Uma boa conversa começa aqui.</h2>
          <p>Escreva sua primeira mensagem para começar.</p>
        </div>
      </section>

      <form class="chat__composer" id="message-form">
        <label class="visually-hidden" for="message-input">
          Digite sua mensagem
        </label>
        <textarea
          class="chat__input"
          id="message-input"
          name="message"
          rows="1"
          placeholder="Escreva uma mensagem..."
          aria-label="Digite sua mensagem"
          required
        ></textarea>
        <button
          class="button button--send"
          id="send-button"
          type="submit"
          aria-label="Enviar mensagem"
          title="Enviar mensagem"
        >
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path
              d="M17 3 9.2 10.8M17 3l-4.95 14-2.85-6.2L3 7.95 17 3Z"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.6"
            />
          </svg>
        </button>
      </form>
      <p class="chat__hint">Enter para enviar <span aria-hidden="true">·</span> Shift + Enter para nova linha</p>
    </main>
  </body>
</html>
